server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Behind the proxy the port nginx listens on is not the one people use: redirect to a path, not to http://host:8080/.
  absolute_redirect off;
  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  types { text/plain txt md; }
  include /etc/nginx/mime.types;

  if ($host = www.folkbranch.com) { return 301 https://folkbranch.com$request_uri; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /health { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 30d; add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options nosniff always; }
  location / { try_files $uri $uri/ $uri/index.html =404; add_header Cache-Control "public, max-age=300" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Strict-Transport-Security "max-age=31536000" always; }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
